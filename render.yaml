# Render 원클릭 배포 — Flask 관리자 (임시 온라인용)
services:
  - type: web
    name: dfirst-incheon-admin
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --chdir admin server:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
